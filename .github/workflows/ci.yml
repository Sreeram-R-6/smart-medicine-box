name: Firmware and host checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/test_host.py
      - run: node tools/test_dashboard.mjs
      - run: python tools/check_project.py
      - run: python tools/render_oled_previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: oled-framebuffer-previews
          path: .pio/oled-ui-preview.png

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [stm32, esp32]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_project.py
      - run: pio run -e ${{ matrix.environment }}
