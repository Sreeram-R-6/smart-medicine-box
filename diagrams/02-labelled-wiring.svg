<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="white"/><g font-family="Arial" font-size="16" fill="#17212c"><text x="30" y="35" font-size="24">Smart Medicine Box: labelled signal connections</text><text x="30" y="65">Dashed amber = verify before connection. Labels are signals, not physical header positions.</text><rect x="30" y="90" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="42" y="114">ST-Link: identify connector</text><text x="42" y="137" font-size="14">SWDIO / SWCLK / GND</text><path d="M450 121 H560" fill="none" stroke="#17654a" stroke-width="2"/><rect x="560" y="90" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="575" y="114">STM32 Blue Pill</text><text x="575" y="137" font-size="14">PA13 / PA14 / GND</text><rect x="30" y="166" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="42" y="190">Buttons: each switch to GND</text><text x="42" y="213" font-size="14">LEFT / RIGHT / BACK / OK</text><path d="M450 197 H560" fill="none" stroke="#17654a" stroke-width="2"/><rect x="560" y="166" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="575" y="190">STM32 Blue Pill</text><text x="575" y="213" font-size="14">PA0 / PA1 / PA4 / PA5</text><rect x="30" y="242" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="42" y="266">LEDs: separate 680 ohm resistors</text><text x="42" y="289" font-size="14">Green / Red anodes</text><path d="M450 273 H560" fill="none" stroke="#17654a" stroke-width="2"/><rect x="560" y="242" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="575" y="266">STM32 Blue Pill</text><text x="575" y="289" font-size="14">PB8 / PB9; cathodes to GND</text><rect x="30" y="318" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="42" y="342">RTC and OLED: check supply</text><text x="42" y="365" font-size="14">SCL / SDA</text><path d="M450 349 H560" fill="none" stroke="#b36b00" stroke-width="2" stroke-dasharray="7 5"/><rect x="560" y="318" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="575" y="342">STM32 Blue Pill</text><text x="575" y="365" font-size="14">PB6 / PB7; pull-ups to safe 3.3 V</text><rect x="30" y="394" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="42" y="418">FC-51: check output voltage</text><text x="42" y="441" font-size="14">OUT</text><path d="M450 425 H560" fill="none" stroke="#b36b00" stroke-width="2" stroke-dasharray="7 5"/><rect x="560" y="394" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="575" y="418">STM32 Blue Pill</text><text x="575" y="441" font-size="14">PB12</text><rect x="30" y="470" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="42" y="494">MH-FMD: driver verification</text><text x="42" y="517" font-size="14">I/O</text><path d="M450 501 H560" fill="none" stroke="#b36b00" stroke-width="2" stroke-dasharray="7 5"/><rect x="560" y="470" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="575" y="494">STM32 Blue Pill</text><text x="575" y="517" font-size="14">PB0; HIGH is intended OFF</text><rect x="30" y="546" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="42" y="570">ESP32-C3: verify actual board</text><text x="42" y="593" font-size="14">GPIO4 RX / GPIO5 TX</text><path d="M450 577 H560" fill="none" stroke="#b36b00" stroke-width="2" stroke-dasharray="7 5"/><rect x="560" y="546" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#b36b00"/><text x="575" y="570">STM32 Blue Pill</text><text x="575" y="593" font-size="14">PA2 TX / PA3 RX</text><rect x="30" y="622" width="420" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="42" y="646">3.3 V USB-TTL adapter</text><text x="42" y="669" font-size="14">RX / GND; VCC disconnected</text><path d="M450 653 H560" fill="none" stroke="#17654a" stroke-width="2"/><rect x="560" y="622" width="500" height="62" rx="6" fill="#f5f7f9" stroke="#17654a"/><text x="575" y="646">STM32 Blue Pill</text><text x="575" y="669" font-size="14">PA9 TX / GND</text><text x="30" y="735">Common ground for signals. Power boards separately through verified inputs. Never parallel regulators.</text><text x="30" y="765">Buzzer disconnected until reset-safe OFF bias is verified. See numbered instructions 02 and 08.</text></g></svg>