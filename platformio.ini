[platformio]
default_envs = stm32
src_dir = firmware
include_dir = shared

[env:stm32]
platform = ststm32@19.0.0
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
board_build.ldscript = firmware/stm32/STM32F103C8_APP.ld
board_upload.maximum_size = 57344
monitor_speed = 115200
build_src_filter = +<stm32/>
build_flags = -Ifirmware/stm32 -DSAFE_BRINGUP=1

[env:esp32]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<esp32/>
build_flags =
    -Ifirmware/esp32
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
